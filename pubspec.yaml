name: domain_extention
description: "Domain Extention - многофункциональное ai приложение с умным асистентом персонажем"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"
  

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0
  yaml: ^3.1.3
  flutter_dotenv: ^6.0.0
  just_audio: ^0.10.5
  audio_session: ^0.2.4
  speech_to_text: ^7.5.0
  record: ^7.1.2
  get_it: ^9.3.0
  flutter_bloc: ^9.1.1
  path_provider: ^2.1.6
  liquid_glass_widgets: ^1.17.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.1.0
  flame: ^1.34.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  


flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/widget_icons/sukuna.png
    - assets/widget_icons/gojo.png
    - .env
    - assets/characters/sukuna/character.yaml
    - assets/characters/sukuna/prompts/
    - assets/characters/sukuna/voice/
    - assets/characters/sukuna/stage/
    - assets/characters/sukuna/stage/variants/
